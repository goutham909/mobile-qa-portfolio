[pytest]
pythonpath = .
testpaths = tests
addopts =
    -ra
    --strict-markers
    --html=reports/report.html
    --self-contained-html
    -p no:cacheprovider
markers =
    smoke: critical-path checks run on every push
    regression: broader functional coverage run nightly or before release
log_cli = true
log_cli_level = INFO
